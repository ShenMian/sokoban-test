<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Sokoban - Offline</title>
		<style>
			html, body {
				margin: 0;
				height: 100%;
			}
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				background-color: #242424;
				color: #e0e0e0;
				font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
				text-align: center;
				padding: 2rem;
			}
			h1 {
				margin: 0;
				font-size: 1.5rem;
			}
			p {
				margin: 0;
				max-width: 32rem;
				line-height: 1.4;
			}
			button {
				padding: 0.6rem 1.2rem;
				border: 0;
				border-radius: 0.4rem;
				background-color: #478cbf;
				color: #fff;
				font-size: 1rem;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<h1>You are offline</h1>
		<p>Sokoban needs an internet connection the first time it is loaded. Please reconnect and try again.</p>
		<button onclick="window.location.reload()">Retry</button>
	</body>
</html>
